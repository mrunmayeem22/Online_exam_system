<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Create Exam</title>
    <link rel="stylesheet" href="/css/main.css">
</head>
<body>

<div class="overlay"></div>

<div class="center-container">
    <div class="admin-form-card">

        <h2 class="admin-title">📝 Create Examination</h2>
        <p class="admin-subtitle">
            Fill in the exam details below. You can add questions in the next step.
        </p>

        <form action="/admin/create-exam" method="post" class="admin-form">

            <div class="form-group">
                <label>Subject Name</label>
                <input type="text" name="subject" placeholder="e.g. Data Structures" required>
            </div>

            <div class="form-group">
                <label>Exam Title</label>
                <input type="text" name="title" placeholder="e.g. Mid Semester Test" required>
            </div>

            <div class="form-group">
                <label>Duration (minutes)</label>
                <input type="number" name="duration" placeholder="e.g. 90" required>
            </div>

            <div class="form-group">
                <label>Total Marks</label>
                <input type="number" name="totalMarks" placeholder="e.g. 100" required>
            </div>

            <div class="form-group">
                <label>Total Questions</label>
                <input type="number" name="totalQuestions" placeholder="e.g. 50" required>
            </div>

            <div class="admin-actions">
                <button type="submit" class="btn admin-btn">Next → Add Questions</button>
            </div>
        </form>
    </div>
</div>
</body>
</html>
