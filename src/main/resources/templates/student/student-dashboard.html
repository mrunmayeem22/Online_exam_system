<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Dashboard</title>
    <link rel="stylesheet" href="/css/main.css">
</head>
<body>

<div class="overlay"></div>

<div class="top-bar">

</div>

    <div class="dashboard-header">
        <h1>Student Dashboard</h1>
        <p>View available exams and track your results</p>
    </div>

        <a href="/student/available-exams" class="dashboard-card">

            <p>View and attempt exams created by admin</p>
        </a>

      <a href="/student/my-results" class="dashboard-card">
    <div class="card-icon">📊</div>
    <h3>My Results</h3>

</a>
 </div>
</div>

</html>
